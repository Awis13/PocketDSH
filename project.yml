name: PocketDSH
options:
  developmentLanguage: en
  bundleIdPrefix: dev.awis
  deploymentTarget:
    iOS: '17.0'
configFiles:
  Debug: Config/Build.xcconfig
  Release: Config/Build.xcconfig
packages:
  SwiftTerm:
    path: Vendor/SwiftTerm
targets:
  PocketDSH:
    type: application
    platform: iOS
    sources:
      - PocketDSH
      - Shared
      - path: Vendor/NerdFonts/SymbolsNerdFontMono-Regular.ttf
        buildPhase: resources
      - path: Vendor/THIRD-PARTY-NOTICES.txt
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    info:
      path: PocketDSH/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        UIAppFonts: [SymbolsNerdFontMono-Regular.ttf]
        BGTaskSchedulerPermittedIdentifiers: ["dev.awis.PocketDSH.turn.*"]
        UIBackgroundModes: [processing]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.awis.PocketDSH
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pocket DSH
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your personal DeepSeek Harness on your local network.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record voice messages and transcribe them on your home server.
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": PocketDSH/Simulator.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PocketDSH/Mac.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        SUPPORTS_MACCATALYST: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  PocketDSHUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PocketDSHUITests]
    dependencies:
      - target: PocketDSH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  PocketDSH:
    build:
      targets:
        PocketDSH: all
    test:
      targets: [PocketDSHUITests]
